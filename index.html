<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 Pianistic Models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F7; --ink:#23307F; --soft:#C4E4F4; --text:#1B1F2E; --muted:#4F566B; --line:#C9D3E0; --on-ink:#F4F7FB; --track:#D7DEEA;
  --warn-bg:#FFF4D6; --warn-text:#5A4300;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10152C;--ink:#9FB0FF;--soft:#24315C;--text:#E6EAF5;--muted:#AAB2CA;--line:#2C3659;--on-ink:#10152C;--track:#2A3354;--warn-bg:#3A3110;--warn-text:#FFE7A3}
}
:root[data-theme="dark"]{--bg:#10152C;--ink:#9FB0FF;--soft:#24315C;--text:#E6EAF5;--muted:#AAB2CA;--line:#2C3659;--on-ink:#10152C;--track:#2A3354;--warn-bg:#3A3110;--warn-text:#FFE7A3}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font-family:"Newsreader",Georgia,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:1.2rem;line-height:1.7;-webkit-font-smoothing:antialiased}
:lang(ja) body{line-height:1.85}
main{max-width:34rem;margin:0 auto;padding:1rem 1.375rem 3rem}
.inapp{background:var(--warn-bg);color:var(--warn-text);border-radius:.6rem;padding:.8rem 1rem;margin:.5rem 0 0;font-size:1.05rem;line-height:1.6}
.top{display:flex;justify-content:flex-end;gap:.2rem}
.lang{background:none;border:0;color:var(--muted);font:inherit;font-size:1.05rem;padding:.45rem .7rem;border-radius:.4rem;cursor:pointer;min-height:2.75rem}
.lang[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:.3em}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ded{font-style:italic;color:var(--muted);font-size:1.02rem;margin:1rem 0 .2rem}
h1{font-weight:500;font-size:clamp(2.2rem,10vw,3.2rem);line-height:1.08;letter-spacing:-.015em;margin:0 0 .35rem;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.movement{font-size:1.3rem;font-weight:500;margin:0 0 .15rem}
.sub{font-style:italic;color:var(--muted);margin:0 0 .3rem}
.composer{text-align:right;margin:0 0 1.6rem;letter-spacing:.04em}

/* waveform */
.wave{position:relative;margin:0 0 .4rem}
.wave canvas{display:block;width:100%;height:120px}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:1rem;font-variant-numeric:tabular-nums;margin:0 0 1.4rem}

/* status + progress */
.status{text-align:center;font-size:1.25rem;margin:0 0 .4rem;min-height:3.4em;display:flex;align-items:center;justify-content:center}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin:.4rem 0 1.6rem}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s linear}
.bar.done{visibility:hidden}

/* the one button */
.play{display:flex;align-items:center;justify-content:center;gap:.9rem;width:100%;min-height:6.5rem;border:0;border-radius:3.25rem;
  background:var(--ink);color:var(--on-ink);font:inherit;font-size:2rem;font-weight:600;letter-spacing:.06em;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.play svg{width:2.2rem;height:2.2rem;fill:currentColor;flex:none}
.play:disabled{background:var(--track);color:var(--muted);cursor:default}
.play.on{background:var(--soft);color:var(--ink);cursor:default}
.second{display:block;margin:1.1rem auto 0;background:none;border:2px solid var(--ink);color:var(--ink);font:inherit;font-size:1.15rem;
  padding:.6rem 1.5rem;border-radius:2rem;cursor:pointer;min-height:3rem;touch-action:manipulation}

ol{margin:2.4rem 0 0;padding:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:.9rem 0 .9rem 2.4rem;border-top:1px solid var(--line)}
ol li:last-child{border-bottom:1px solid var(--line)}
ol li::before{content:counter(s);position:absolute;left:0;top:.8rem;font-size:1.5rem;line-height:1.2;color:var(--ink);font-weight:500}
.perf{margin-top:2.6rem}
.perf h2{font-size:1rem;font-weight:500;letter-spacing:.08em;color:var(--muted);margin:0 0 .8rem}
.perf dl{margin:0}
.perf dt{font-weight:500}
.perf dd{margin:0 0 1rem;color:var(--muted);font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main>
  <p class="inapp" id="inapp" data-t="inapp" hidden></p>
  <div class="top" role="group" aria-label="Language">

  <div class="bar" id="bar"><i id="fill"></i></div>

  <button class="play" id="play" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>

  </button>
  <button class="second" id="test" hidden></button>

    <dl>

      <dd data-t="p1"></dd>

  </section>
</main>

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t]; e.textContent=typeof v==="function"?v():v;});

  $("status").textContent = state==="loading" ? (pct?t.progress(pct):t.loading)
    : state==="ready"?t.ready : state==="playing"?t.playingS : state==="stopped"?t.stopped
    : state==="ended"?t.ended : state==="failed"?t.failed : t.noaudio;
  $("playlbl").textContent = state==="playing"?t.playing : t.play;
  $("play").disabled = state!=="ready";
  $("play").classList.toggle("on",state==="playing");

}

/* ---------- waveform ---------- */
const DUR0=PEAKS.dur;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function draw(progress){
  const cv=$("wave"), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), ink=cs.getPropertyValue("--ink").trim(), soft=cs.getPropertyValue("--track").trim();
  const P=PEAKS.peaks, n=P.length, mid=h/2, x=i=>i/(n-1)*w;
  const shape=()=>{c.beginPath(); c.moveTo(0,mid);
    for(let i=0;i<n;i++)c.lineTo(x(i),mid-Math.max(.6,P[i]*(mid-4)));
    for(let i=n-1;i>=0;i--)c.lineTo(x(i),mid+Math.max(.6,P[i]*(mid-4)));
    c.closePath();};
  shape(); c.fillStyle=soft; c.fill();
  if(progress>0){ c.save(); c.beginPath(); c.rect(0,0,progress*w,h); c.clip(); shape(); c.fillStyle=ink; c.fill(); c.restore(); }
  c.fillStyle=ink; c.fillRect(0,4,1.5,h-8); c.fillRect(w-1.5,4,1.5,h-8);            // start / end marks
  if(progress>0&&progress<1){ c.fillRect(progress*w-1,0,2,h); }                       // playhead
}
function totalDur(){ return isFinite(audio.duration)&&audio.duration>0 ? audio.duration : DUR0; }
function redraw(){ const pos=state==="ended"?totalDur():audio.currentTime; draw(Math.min(1,pos/totalDur())); $("tnow").textContent=fmt(pos); }
let ticking=false;
function tick(){ redraw(); if(state==="playing") requestAnimationFrame(tick); else ticking=false; }
function startTick(){ if(!ticking){ ticking=true; requestAnimationFrame(tick); } }
$("tend").textContent=fmt(DUR0); draw(0);

/* ---------- when the listener started (kept on the phone, so a reopened page can rejoin) ---------- */
const SKEY="tpm-start-v"+VERSION; let startMem=null;
function setStart(t){ startMem=t; try{ t==null?localStorage.removeItem(SKEY):localStorage.setItem(SKEY,String(t)); }catch(e){} }
function getStart(){ try{ const v=localStorage.getItem(SKEY); if(v) return +v; }catch(e){} return startMem; }
function elapsed(){ const s=getStart(); return s?(Date.now()-s)/1000:0; }

/* ---------- download once, keep it on the phone for offline use ---------- */
const CACHE="tpm-audio-v"+VERSION, KEY=AUDIO+"?v="+VERSION;
async function fromCache(){ try{ const c=await caches.open(CACHE); const r=await c.match(KEY); if(!r) return null; const b=await r.blob(); return b.size>100000?b:null; }catch(e){ return null; } }
async function toCache(blob){ try{ const c=await caches.open(CACHE); await c.put(KEY,new Response(blob,{headers:{"Content-Type":"audio/mpeg"}}));
  for(const k of await caches.keys()) if(k.startsWith("tpm-audio-")&&k!==CACHE) caches.delete(k);
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){} }
async function dropCache(){ try{ await caches.delete(CACHE); }catch(e){} }
async function download(){
  if(window.EMBEDDED){ const b=atob(window.EMBEDDED.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return new Blob([u],{type:"audio/mpeg"}); }
  const r=await fetch(KEY,{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
  const total=+r.headers.get("Content-Length")||0;
  if(!r.body||!total){ return await r.blob(); }
  const rd=r.body.getReader(), parts=[]; let got=0;
  for(;;){ const {done,value}=await rd.read(); if(done)break; parts.push(value); got+=value.length;
    const p=Math.min(99,Math.floor(got/total*100)); if(p!==pct){pct=p; $("fill").style.width=p+"%"; render();} }
  return new Blob(parts,{type:"audio/mpeg"});
}
async function prepare(){
  state="loading"; pct=0; $("fill").style.width="0%"; render();
  try{
    let blob=await fromCache();
    if(!blob){ blob=await download(); await toCache(blob); }
    audio.src=URL.createObjectURL(blob);         // the whole file is now on the phone
    $("fill").style.width="100%";
    // reopened during or just after the performance?
    const el=elapsed();
    if(getStart() && el>0 && el<DUR0-3) state="stopped";
    else if(getStart() && el>=DUR0-3 && el<DUR0+3600) state="ended";
    else { setStart(null); state="ready"; }
    render(); redraw();
  }catch(e){ state="failed"; render(); }
}
$("retry").onclick=prepare;

/* ---------- test sound: a short chime through the same kind of player ---------- */
let testing=false, testAudio=null;
function chime(){
  const sr=22050, n=Math.floor(sr*1.8), buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  const notes=[[0,659.25],[0.45,987.77]];
  for(let i=0;i<n;i++){ const t=i/sr; let s=0;
    for(const [on,f] of notes){ const d=t-on; if(d<0) continue; const env=Math.min(1,d/0.006)*Math.exp(-d*3.2);
      s+=env*(Math.sin(2*Math.PI*f*d)+0.35*Math.sin(4*Math.PI*f*d)+0.12*Math.sin(6*Math.PI*f*d)); }
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,s*0.42))*32767,true); }
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
$("test").onclick=async()=>{
  if(testing) return;
  if(!testAudio){ testAudio=new Audio(chime()); testAudio.setAttribute("playsinline",""); testAudio.onended=()=>{testing=false; render();}; }
  testAudio.currentTime=0;
  try{ testing=true; render(); await testAudio.play(); }catch(e){ testing=false; render(); alert(T[lang].noaudio); }
};

/* ---------- play ---------- */
let wakeLock=null;
async function keepAwake(){ try{ if("wakeLock" in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null);} }catch(e){} }
function letSleep(){ if(wakeLock) wakeLock.release().catch(()=>{}); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&state==="playing") keepAwake(); });

async function go(){
  if(state!=="ready") return;
  setStart(Date.now());
  if(audio.readyState>=1){ try{ audio.currentTime=0; }catch(e){} }
  try{ await audio.play(); }catch(e){ setStart(null); alert(T[lang].noaudio); return; }
  state="playing"; render(); keepAwake(); startTick();
}
$("play").onclick=()=>{ if(!$("play").disabled) go(); };

audio.addEventListener("loadedmetadata",()=>{ $("tend").textContent=fmt(audio.duration); });
audio.addEventListener("pause",()=>{             // a call, the lock-screen button, earphones unplugged…
  if(audio.ended||state!=="playing") return;
  state="stopped"; render(); redraw(); letSleep();   // it stays stopped: the listener simply keeps listening
});
audio.addEventListener("play",()=>{ if(state==="stopped"||state==="ended") audio.pause(); });
audio.addEventListener("ended",()=>{ state="ended"; render(); redraw(); letSleep(); });
audio.addEventListener("error",async()=>{       // the stored copy is damaged: fetch a fresh one
  if(state==="loading"||!audio.getAttribute("src")) return;
  await dropCache(); state="failed"; render();
});

/* lock screen: show the title; no restarting or scrubbing from there */
if("mediaSession" in navigator){
  try{ navigator.mediaSession.metadata=new MediaMetadata({title:TITLE+" – 2. Object-oriented",artist:COMPOSER}); }catch(e){}
  try{ navigator.mediaSession.setActionHandler("play",()=>{}); }catch(e){}
  try{ navigator.mediaSession.setActionHandler("seekto",()=>{}); }catch(e){}
}

/* staff only: tap the title 5 times to reset this phone to “Ready.” */
let taps=0,tapTimer;
$("title").addEventListener("click",()=>{
  if(state==="loading"||state==="failed") return;
  taps++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>taps=0,1500);
  if(taps>=5){ taps=0; audio.pause(); state="ready"; setStart(null); try{audio.currentTime=0;}catch(e){} letSleep(); render(); redraw(); }
});

/* keep this page itself available offline (reopen or rescan underground) */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

render(); prepare();
</script>
</body>
